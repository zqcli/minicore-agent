data_dir = "./.minicore-agent"
event_capacity = 256
default_profile = "coding"

[profiles.coding]
model = "main"
reasoning = "medium"
system_prompt = """
You are a coding agent. Inspect the workspace, use tools when useful,
make focused changes, run relevant checks, and explain the result.
"""
# The legacy inline form above remains supported. To load the prompt once from
# a UTF-8 file relative to this config file, use instead:
# system_prompt = { file = "prompts/coding.md" }
tools = ["read", "write", "edit", "apply_patch", "bash"]
# Add "subagent" explicitly to enable native stateless child-loop delegation.
max_tool_rounds = 32
# Auto mode executes enabled tools without user approval. Use only in a trusted local environment.
approval = "auto"

# Optional per-loop overrides on top of the Runtime safe defaults.
# [loop]
# event_capacity = 256
# max_pending_steers = 16
# prompt_timeout_seconds = 30
# model_timeout_seconds = 600
# policy_timeout_seconds = 30
# tool_timeout_seconds = 1800
# model_retry_attempts = 2
# model_retry_base_delay_millis = 100

# Agent-global automatic compaction policy. Manual session.compact stays
# available when disabled. Requires 0 < target_percent < trigger_percent <= 100.
# [compaction]
# enabled = true
# trigger_percent = 80
# target_percent = 50

[models.main]
provider = "open_ai_responses"
model = "your-model-id"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
physical_context_window = 200000
output_budget_tokens = 24000
safety_margin_tokens = 4000
# This is an explicit allowlist for this exact model and endpoint; it is not
# inferred from the provider. Extend it only when the endpoint documents the
# corresponding values, for example:
# supported_reasoning = ["auto", "disabled", "low", "medium", "high", "xhigh", "max", "ultra"]
# `ultra` is only for an endpoint that explicitly supports that custom or
# future effort value; OpenAI's official support is model-specific.
supported_reasoning = ["auto", "disabled", "low", "medium", "high"]
supports_tools = true
request_timeout_seconds = 600