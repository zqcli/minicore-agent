[package]
name = "minicore-agent"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "RPC-first MiniCore Agent"

[lib]
name = "minicore_agent"
path = "src/lib.rs"

[[bin]]
name = "minicore-agent"
path = "src/main.rs"

[dependencies]
# The Runtime release this Agent is built and tested against.
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", tag = "v0.8.0", version = "0.8.0" }
# Owned process groups/jobs for the Bash command worker. `tracing` is left off
# on purpose: a wrapped command must never be logged with its script text.
process-wrap = { version = "8.2", default-features = false, features = [
  "tokio1",
  "process-group",
  "job-object",
  "kill-on-drop",
] }
base64 = "0.22"
getrandom = "0.4"
bytes = "1"
futures-util = "0.3"
httpdate = "1"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Structured line diffs for `changes.diff`.
similar = { version = "3", default-features = false, features = ["text"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", default-features = false, features = [
  "io-std",
  "io-util",
  "fs",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
toml = "1"

# Unix-only: non-blocking, no-follow flags for workspace file reads, and the
# process-group observation the Bash command worker needs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Process-group signalling and liveness only; no filesystem or net features.
nix = { version = "0.30", default-features = false, features = [
  "signal",
  "process",
] }

[lints.rust]
unsafe_code = "forbid"
