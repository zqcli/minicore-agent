[package]
name = "minicore-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "RPC-first MiniCore Agent skeleton"

[lib]
name = "minicore_agent"
path = "src/lib.rs"

[[bin]]
name = "minicore-agent"
path = "src/main.rs"

[dependencies]
# Public API is pinned to this exact upstream runtime revision.
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", rev = "7e85eaab18e273e43e03c50040b460f1b13f0ac9", version = "0.3.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.53.1", default-features = false, features = [
  "io-std",
  "io-util",
  "fs",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
toml = "0.8.23"

[dev-dependencies]
futures-util = "0.3.33"
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"
