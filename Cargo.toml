[package]
name = "minicore-agent"
version = "0.3.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "RPC-first MiniCore Agent"

[lib]
name = "minicore_agent"
path = "src/lib.rs"

[[bin]]
name = "minicore-agent"
path = "src/main.rs"

[dependencies]
# Public API is pinned to this exact upstream runtime revision.
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", rev = "6cd2bdbc634437dea925495c61c7eb0be10ba171", version = "0.4.1" }
# Owned process groups/jobs for the Bash command worker. `tracing` is left off
# on purpose: a wrapped command must never be logged with its script text.
process-wrap = { version = "=8.2.0", default-features = false, features = [
  "tokio1",
  "process-group",
  "job-object",
  "kill-on-drop",
] }
base64 = "=0.22.1"
getrandom = "=0.3.3"
bytes = "=1.10.1"
futures-util = "=0.3.33"
httpdate = "=1.0.3"
ignore = "=0.4.23"
regex = "=1.11.1"
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "=0.10.9"
thiserror = "2.0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.53.1", default-features = false, features = [
  "io-std",
  "io-util",
  "fs",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
toml = "0.8.23"

# Unix-only: non-blocking, no-follow flags for workspace file reads, and the
# process-group observation the Bash command worker needs.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
# Process-group signalling and liveness only; no filesystem or net features.
nix = { version = "=0.29.0", default-features = false, features = [
  "signal",
  "process",
] }

[lints.rust]
unsafe_code = "forbid"
